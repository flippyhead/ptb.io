# Permalinks
#
permalink:           pretty

# Setup
title:               ptb.io
tagline:             'ha ha made ya read!'
description:         'The personal website for Peter Travis Brown.'
url:                 https://ptb.io
baseurl:             ''

# Keep build/editor files out of the published site. Listed exhaustively
# because a user-supplied `exclude` can replace Jekyll's defaults.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - package-lock.json
  - start
  - node_modules
  - vendor

# About/contact
author:
  name:              Peter T. Brown
  url:               https://ptb.io
  email:             p@ptb.io

